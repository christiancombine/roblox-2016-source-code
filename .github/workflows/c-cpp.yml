name: Roblox 2016 CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  windows-build:
    name: Build Client + RCC (Windows)
    runs-on: windows-2022
    timeout-minutes: 240

    env:
      CONTRIB_PATH: ${{ github.workspace }}\Contribs

    steps:

      - name: Enable Long Paths
        shell: powershell
        run: git config --system core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Init Submodules (safe)
        shell: cmd
        continue-on-error: true
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive || exit /b 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup VS2012 Toolset
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: 11.0

      - name: Build RCCService
        shell: cmd
        run: |
          msbuild Client_2016.sln ^
            /t:RCCService ^
            /m ^
            /p:Configuration=ReleaseRCC ^
            /p:Platform=Win32 ^
            /p:PlatformToolset=v110_xp

      - name: Build Roblox Client
        shell: cmd
        run: |
          msbuild Client_2016.sln ^
            /t:WindowsClient ^
            /m ^
            /p:Configuration=Release ^
            /p:Platform=Win32 ^
            /p:PlatformToolset=v110_xp

      # -----------------------------
      # Install 7-Zip
      # -----------------------------
      - name: Install 7-Zip
        shell: powershell
        run: |
          choco install 7zip -y

      # -----------------------------
      # Package Client (FULL DIR)
      # -----------------------------
      - name: Package Client (7z)
        shell: powershell
        run: |
          $out = "client_pkg"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          robocopy . $out /E /XD .git obj Debug ReleaseRCC build-wasm Contribs

          & "C:\Program Files\7-Zip\7z.exe" a RobloxPlayerBeta-Windows.7z $out\*

      # -----------------------------
      # Package RCC (FULL DIR)
      # -----------------------------
      - name: Package RCC (7z)
        shell: powershell
        run: |
          $out = "rcc_pkg"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          robocopy . $out /E /XD .git obj Debug Release build-wasm Contribs

          & "C:\Program Files\7-Zip\7z.exe" a RCCService-Windows.7z $out\*

      # -----------------------------
      # Upload artifacts
      # -----------------------------
      - name: Upload Client
        uses: actions/upload-artifact@v4
        with:
          name: RobloxPlayerBeta-Windows
          path: RobloxPlayerBeta-Windows.7z

      - name: Upload RCC
        uses: actions/upload-artifact@v4
        with:
          name: RCCService-Windows
          path: RCCService-Windows.7z
