name: Roblox 2016 CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:

  windows-client:
    name: Build RobloxPlayerBeta
    runs-on: windows-2022
    timeout-minutes: 180

    env:
      CONTRIB_PATH: ${{ github.workspace }}\Contribs

    steps:

      - name: Enable Long Paths
        shell: powershell
        run: |
          git config --system core.longpaths true

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false
          submodules: false
          lfs: false

      - name: Fix Submodules
        shell: cmd
        continue-on-error: true
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive || exit /b 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Force v143 Toolset
        shell: powershell
        continue-on-error: true
        run: |
          Get-ChildItem -Recurse *.vcxproj | ForEach-Object {
            (Get-Content $_.FullName) `
              -replace '<PlatformToolset>v110_xp</PlatformToolset>', '<PlatformToolset>v143</PlatformToolset>' `
              -replace '<PlatformToolset>v110</PlatformToolset>', '<PlatformToolset>v143</PlatformToolset>' |
              Set-Content $_.FullName
          }

      - name: Disable Warnings As Errors
        shell: powershell
        continue-on-error: true
        run: |
          Get-ChildItem -Recurse *.vcxproj | ForEach-Object {
            (Get-Content $_.FullName) `
              -replace '<TreatWarningAsError>true</TreatWarningAsError>', '<TreatWarningAsError>false</TreatWarningAsError>' |
              Set-Content $_.FullName
          }

      - name: Patch SDL Includes
        shell: powershell
        continue-on-error: true
        run: |
          Get-ChildItem -Recurse *.vcxproj | ForEach-Object {
            (Get-Content $_.FullName) `
              -replace 'SDL2\.0\.4', 'SDL2' |
              Set-Content $_.FullName
          }

      - name: Build RobloxPlayerBeta
        shell: cmd
        continue-on-error: true
        run: |
          msbuild Client_2016.sln ^
            /t:WindowsClient ^
            /m ^
            /p:Configuration=Release ^
            /p:Platform=Win32 ^
            /p:PlatformToolset=v143

      - name: Prepare Client Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path package

          Get-ChildItem -Recurse -Filter RobloxPlayerBeta.exe |
            Copy-Item -Destination package -Force

          Get-ChildItem -Recurse -Filter *.dll |
            Copy-Item -Destination package -Force

          Get-ChildItem -Recurse -Filter *.pdb |
            Copy-Item -Destination package -Force

          Get-ChildItem -Recurse -Directory |
            Where-Object { $_.Name -match "content|shaders|PlatformContent|ExtraContent" } |
            Copy-Item -Destination package -Recurse -Force

      - name: Create Client ZIP
        shell: powershell
        run: |
          Compress-Archive -Path package\* -DestinationPath RobloxPlayerBeta-Windows.zip

      - name: Upload Client ZIP
        uses: actions/upload-artifact@v4
        with:
          name: RobloxPlayerBeta-Windows
          path: RobloxPlayerBeta-Windows.zip

  windows-rcc:
    name: Build RCCService
    runs-on: windows-2022
    timeout-minutes: 180

    env:
      CONTRIB_PATH: ${{ github.workspace }}\Contribs

    steps:

      - name: Enable Long Paths
        shell: powershell
        run: |
          git config --system core.longpaths true

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false
          submodules: false
          lfs: false

      - name: Fix Submodules
        shell: cmd
        continue-on-error: true
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive || exit /b 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Force v143 Toolset
        shell: powershell
        continue-on-error: true
        run: |
          Get-ChildItem -Recurse *.vcxproj | ForEach-Object {
            (Get-Content $_.FullName) `
              -replace '<PlatformToolset>v110_xp</PlatformToolset>', '<PlatformToolset>v143</PlatformToolset>' `
              -replace '<PlatformToolset>v110</PlatformToolset>', '<PlatformToolset>v143</PlatformToolset>' |
              Set-Content $_.FullName
          }

      - name: Disable Warnings As Errors
        shell: powershell
        continue-on-error: true
        run: |
          Get-ChildItem -Recurse *.vcxproj | ForEach-Object {
            (Get-Content $_.FullName) `
              -replace '<TreatWarningAsError>true</TreatWarningAsError>', '<TreatWarningAsError>false</TreatWarningAsError>' |
              Set-Content $_.FullName
          }

      - name: Build RCCService
        shell: cmd
        continue-on-error: true
        run: |
          msbuild Client_2016.sln ^
            /t:RCCService ^
            /m ^
            /p:Configuration=ReleaseRCC ^
            /p:Platform=Win32 ^
            /p:PlatformToolset=v143

      - name: Prepare RCC Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path rccpackage

          Get-ChildItem -Recurse -Filter RCCService.exe |
            Copy-Item -Destination rccpackage -Force

          Get-ChildItem -Recurse -Filter *.dll |
            Copy-Item -Destination rccpackage -Force

      - name: Create RCC ZIP
        shell: powershell
        run: |
          Compress-Archive -Path rccpackage\* -DestinationPath RCCService-Windows.zip

      - name: Upload RCC ZIP
        uses: actions/upload-artifact@v4
        with:
          name: RCCService-Windows
          path: RCCService-Windows.zip

  webassembly-client:
    name: Experimental WebAssembly Build
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false
          submodules: false
          lfs: false

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14

      - name: Verify Emscripten
        run: |
          emcc -v
          em++ -v

      - name: Create WASM Build Folder
        run: mkdir -p build-wasm

      - name: Attempt WebAssembly Build
        working-directory: build-wasm
        continue-on-error: true
        run: |
          emcmake cmake .. -DCMAKE_BUILD_TYPE=Release
          emmake make -j$(nproc)

      - name: Package WASM Build
        shell: bash
        run: |
          mkdir -p wasm-package

          find build-wasm -name "*.wasm" -exec cp {} wasm-package/ \;
          find build-wasm -name "*.js" -exec cp {} wasm-package/ \;
          find build-wasm -name "*.html" -exec cp {} wasm-package/ \;

          cd wasm-package
          zip -r ../Roblox2016-WebAssembly.zip .

      - name: Upload WASM ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Roblox2016-WebAssembly
          path: Roblox2016-WebAssembly.zip
